name: Valheim AI Skill snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valheim-ai-skill-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install test dependencies
        run: python -m pip install -r src/scripts/requirements-assets.txt
      - name: Test distribution and inspection helpers
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and validate the release ZIP with MSBuild
        run: dotnet msbuild ValheimAISkill.proj -t:package

  snapshot:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build snapshot package
        run: dotnet msbuild ValheimAISkill.proj -t:package -p:PackageFile=dist/valheim-ai-skill-1.0-snapshot.zip
      - name: Publish rolling snapshot prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view snapshot --json isPrerelease --jq '.isPrerelease' > /tmp/snapshot-state; then
            test "$(cat /tmp/snapshot-state)" = "true"
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/snapshot" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/snapshot -f sha="$GITHUB_SHA" > /dev/null
          fi
          notes=$(printf 'Current version of the Valheim AI Skill: 1.0-snapshot.\n\nFor installation and usage instructions, see [Download and install](https://github.com/landoria-gaming/ValheimAISkill#download-and-install).')
          if gh release view snapshot > /dev/null 2>&1; then
            gh release edit snapshot --title "Valheim AI Skill 1.0-snapshot" --notes "$notes" --prerelease --latest=false
          gh release upload snapshot dist/valheim-ai-skill-1.0-snapshot.zip --clobber
          else
            gh release create snapshot dist/valheim-ai-skill-1.0-snapshot.zip --verify-tag --title "Valheim AI Skill 1.0-snapshot" --notes "$notes" --prerelease --latest=false
          fi
